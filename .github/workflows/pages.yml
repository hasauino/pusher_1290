# Rebuilds the build manual from the CAD source and publishes it to GitHub Pages.
name: Publish manual

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # Only the CAD dependencies; the aerodynamics stack isn't needed for the manual.
      - name: Install CAD dependencies
        run: pip install $(grep -E '^(numpy|manifold3d|pillow)==' requirements.txt)

      - name: Build the manual from the CAD
        run: python cad/export_web.py --site _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
